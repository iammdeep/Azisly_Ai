          const matchR = f.readiness === 'all' || e.jobReadiness === f.readiness;
          return matchQ && matchR;
        });

        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2">
                <input id="eng-search" type="text" value="${esc(f.search)}" placeholder="Search student engagement..." class="px-3 py-2 text-sm border border-slate-300 rounded-lg min-w-[200px]" />
                <select id="eng-filter-ready" class="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  <option value="all">All Job-Readiness Levels</option>
                  <option value="Beginner" ${f.readiness === 'Beginner' ? 'selected' : ''}>Beginner</option>
                  <option value="Developing" ${f.readiness === 'Developing' ? 'selected' : ''}>Developing</option>
                  <option value="Interview-Ready" ${f.readiness === 'Interview-Ready' ? 'selected' : ''}>Interview-Ready</option>
                  <option value="Placed" ${f.readiness === 'Placed' ? 'selected' : ''}>Placed</option>
                </select>
              </div>
              <button id="add-eng-btn" type="button" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Engagement
              </button>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              ${filtered.length === 0
                ? emptyStateHTML('briefcase', 'No career engagement records yet', 'Track mock interviews, resume preparation, counselling, and job-readiness.', 'Add Engagement', 'eng-empty-btn')
                : `<div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                      <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                          <th class="px-4 py-3">Student / Customer</th>
                          <th class="px-4 py-3">Mock Interviews</th>
                          <th class="px-4 py-3">Resume Prep</th>
                          <th class="px-4 py-3">Counselling</th>
                          <th class="px-4 py-3">Job Readiness</th>
                          <th class="px-4 py-3">Feedback</th>
                          <th class="px-4 py-3 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100 text-sm">
                        ${filtered.map(e => {
                          const cust = state.customers.find(c => c.id === e.customerId);
                          return `
                            <tr class="hover:bg-slate-50/70">
                              <td class="px-4 py-3 font-medium text-slate-900">${esc(cust ? cust.name : 'Student')}</td>
                              <td class="px-4 py-3 text-slate-700 text-xs">${esc(e.mockInterviews)}</td>
                              <td class="px-4 py-3 text-slate-700 text-xs">${esc(e.resumePrep)}</td>
                              <td class="px-4 py-3 text-slate-700 text-xs">${esc(e.counselling)}</td>
                              <td class="px-4 py-3"><span class="px-2.5 py-0.5 text-xs font-medium rounded-full border ${badgeClass(e.jobReadiness)}">${esc(e.jobReadiness)}</span></td>
                              <td class="px-4 py-3 text-xs text-slate-600 max-w-xs truncate">${esc(e.feedback || '—')}</td>
                              <td class="px-4 py-3 text-right space-x-1">
                                <button type="button" data-edit-eng="${e.id}" class="p-1.5 text-slate-500 hover:text-blue-600 rounded-md hover:bg-blue-50"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                <button type="button" data-del-eng="${e.id}" class="p-1.5 text-slate-500 hover:text-red-600 rounded-md hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                              </td>
                            </tr>
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>`
              }
            </div>
          </div>
        `;

        document.getElementById('eng-search').addEventListener('input', e => { filters.engagement.search = e.target.value; renderCurrentPage(); });
        document.getElementById('eng-filter-ready').addEventListener('change', e => { filters.engagement.readiness = e.target.value; renderCurrentPage(); });
        document.getElementById('add-eng-btn').addEventListener('click', () => openEngagementModal());
        const emptyBtn = document.getElementById('eng-empty-btn');
        if (emptyBtn) emptyBtn.addEventListener('click', () => openEngagementModal());

        container.querySelectorAll('[data-edit-eng]').forEach(b => b.addEventListener('click', () => openEngagementModal(b.getAttribute('data-edit-eng'))));
        container.querySelectorAll('[data-del-eng]').forEach(b => b.addEventListener('click', () => {
          const id = b.getAttribute('data-del-eng');
          openConfirm('Delete Engagement Record', 'Delete this career engagement record?', 'Delete', () => {
            state.engagements = state.engagements.filter(x => x.id !== id);
            saveState();
            showToast('Engagement record deleted.');
            renderCurrentPage();
          });
        }));
      }

      function openEngagementModal(engId) {
        if (state.customers.length === 0) {
          showToast('Please add a customer first.', 'info');
          openCustomerModal();
          return;
        }
        const existing = engId ? state.engagements.find(e => e.id === engId) : null;
        openModal(existing ? 'Edit Career Engagement' : 'Add Career Engagement', `
          <form id="eng-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Student / Customer *</label>
                <select name="customerId" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  ${state.customers.map(c => `<option value="${c.id}" ${existing && existing.customerId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Mock Interview Participation</label>
                <select name="mockInterviews" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  ${['Not Started', '1-2 Completed', '3+ Completed', 'Ongoing'].map(v => `<option value="${v}" ${existing && existing.mockInterviews === v ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Resume Preparation</label>
                <select name="resumePrep" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  ${['Not Started', 'Draft Ready', 'Reviewed', 'Finalized'].map(v => `<option value="${v}" ${existing && existing.resumePrep === v ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Career Counselling</label>
                <select name="counselling" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  ${['Pending', 'Scheduled', 'Completed'].map(v => `<option value="${v}" ${existing && existing.counselling === v ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-slate-700 mb-1">Job-Readiness Status</label>
                <select name="jobReadiness" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                  ${['Beginner', 'Developing', 'Interview-Ready', 'Placed'].map(v => `<option value="${v}" ${existing && existing.jobReadiness === v ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Student Feedback</label>
              <textarea name="feedback" rows="3" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">${esc(existing ? existing.feedback : '')}</textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="eng-cancel-btn" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg">Cancel</button>
              <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Save</button>
            </div>
          </form>
        `, body => {
          body.querySelector('#eng-cancel-btn').addEventListener('click', closeModal);
          body.querySelector('#eng-form').addEventListener('submit', e => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const payload = {
              id: existing ? existing.id : uid('eng'),
              customerId: fd.get('customerId'),
              mockInterviews: fd.get('mockInterviews'),
              resumePrep: fd.get('resumePrep'),
              counselling: fd.get('counselling'),
              jobReadiness: fd.get('jobReadiness'),
              feedback: fd.get('feedback').trim()
            };
            if (existing) {
              state.engagements = state.engagements.map(x => x.id === existing.id ? payload : x);
              showToast('Engagement updated.');
            } else {
              state.engagements.push(payload);
              showToast('Engagement added.');
            }
            saveState();
            closeModal();
            renderCurrentPage();
          });
        });
      }

      // ========================
      // 9. REPORTS
      // ========================
      function renderReports(container) {
        const m = computeMetrics();
        const totalLeads = state.leads.length;
        const convertedLeads = state.leads.filter(l => l.status === 'Converted').length;
        const convRate = totalLeads > 0 ? ((convertedLeads / totalLeads) * 100).toFixed(1) : '0.0';

        // Lead source breakdown
        const sourceStats = LEAD_SOURCES.map(src => {
          const all = state.leads.filter(l => l.source === src);
          const conv = all.filter(l => l.status === 'Converted').length;
          return { src, count: all.length, conv };
        }).filter(x => x.count > 0);

        // Employee performance
        const empStats = state.settings.employees.map(emp => {
          const empLeads = state.leads.filter(l => l.assignedTo === emp);
          const empConv = empLeads.filter(l => l.status === 'Converted').length;
          const empCustIds = new Set(state.customers.filter(c => c.assignedTo === emp).map(c => c.id));
          const empRev = state.sales.filter(s => empCustIds.has(s.customerId) && (s.status === 'Paid' || s.status === 'Partially Paid')).reduce((a, b) => a + (Number(b.amount) || 0), 0);
          return { emp, leads: empLeads.length, conv: empConv, rev: empRev };
        });

        container.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <div class="text-xs font-medium text-slate-500 uppercase">Total Revenue</div>
                <div class="text-2xl font-bold text-slate-900 mt-1">${formatMoney(m.totalRevenue)}</div>
              </div>
              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <div class="text-xs font-medium text-slate-500 uppercase">Lead Conversion Rate</div>
                <div class="text-2xl font-bold text-slate-900 mt-1">${convRate}%</div>
                <div class="text-xs text-slate-500 mt-0.5">${convertedLeads} of ${totalLeads} leads</div>
              </div>
              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <div class="text-xs font-medium text-slate-500 uppercase">Pending Payments</div>
                <div class="text-2xl font-bold text-amber-600 mt-1">${formatMoney(m.pendingPaymentsAmount)}</div>
                <div class="text-xs text-slate-500 mt-0.5">${m.pendingPaymentsCount} pending record(s)</div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 class="text-sm font-semibold text-slate-900 mb-3">Lead Source Performance</h2>
                ${sourceStats.length === 0
                  ? emptyStateHTML('pie-chart', 'No lead data yet', 'Add leads to compare Instagram, WhatsApp, Website, and other sources.')
                  : '<div class="relative h-72"><canvas id="rep-chart-sources"></canvas></div>'
                }
              </div>

              <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 class="text-sm font-semibold text-slate-900 mb-3">Employee Performance</h2>
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase">
                        <th class="px-3 py-2.5">Employee</th>
                        <th class="px-3 py-2.5">Leads</th>
                        <th class="px-3 py-2.5">Conversions</th>
                        <th class="px-3 py-2.5 text-right">Revenue</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${empStats.map(e => `
                        <tr>
                          <td class="px-3 py-2.5 font-medium text-slate-800">${esc(e.emp)}</td>
                          <td class="px-3 py-2.5 text-slate-600">${e.leads}</td>
                          <td class="px-3 py-2.5 text-slate-600">${e.conv}</td>
                          <td class="px-3 py-2.5 text-right font-semibold text-slate-900">${formatMoney(e.rev)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;

        if (sourceStats.length > 0 && window.Chart) {
          const ctx = document.getElementById('rep-chart-sources');
          if (ctx) {
            activeCharts.push(new Chart(ctx, {
              type: 'doughnut',
              data: {
                labels: sourceStats.map(s => s.src),
                datasets: [{
                  data: sourceStats.map(s => s.count),
                  backgroundColor: ['#2563eb', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b']
                }]
              },
              options: { responsive: true, maintainAspectRatio: false }
            }));
          }
        }
      }

      // ========================
      // 10. SETTINGS
      // ========================
      function renderSettings(container) {
        container.innerHTML = `
          <div class="max-w-3xl space-y-6">
            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
              <h2 class="text-base font-semibold text-slate-900 mb-4">Company &amp; Preferences</h2>
              <form id="settings-form" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Company Name</label>
                    <input name="companyName" value="${esc(state.settings.companyName)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Currency Symbol</label>
                    <select name="currency" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
                      <option value="₹" ${state.settings.currency === '₹' ? 'selected' : ''}>₹ (INR)</option>
                      <option value="$" ${state.settings.currency === '$' ? 'selected' : ''}>$ (USD)</option>
                    </select>
                  </div>
                </div>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Save Preferences</button>
              </form>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
              <h2 class="text-base font-semibold text-slate-900 mb-2">Sales Team &amp; Employees</h2>
              <p class="text-xs text-slate-500 mb-4">Employees listed here appear in Lead, Customer, and Task assignment dropdowns.</p>
              <form id="add-emp-form" class="flex gap-2 mb-4">
                <input id="new-emp-input" type="text" placeholder="Enter employee name..." class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg" />
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Add</button>
              </form>
              <div class="flex flex-wrap gap-2">
                ${state.settings.employees.map(emp => `
                  <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 text-slate-800 text-xs font-medium">
                    ${esc(emp)}
                    <button type="button" data-rm-emp="${esc(emp)}" class="text-slate-400 hover:text-red-600">&times;</button>
                  </span>
                `).join('')}
              </div>
            </div>

            <div class="bg-white rounded-xl border border-red-200 p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-base font-semibold text-red-700">Reset Application Data</h2>
                <p class="text-xs text-slate-500 mt-0.5">Clear all customers, leads, sales, and tasks back to zero.</p>
              </div>
              <button id="reset-all-btn" type="button" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">Reset All Data</button>
            </div>
          </div>
        `;

        document.getElementById('settings-form').addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.settings.companyName = fd.get('companyName').trim() || 'Azisly.ai';
          state.settings.currency = fd.get('currency');
          saveState();
          showToast('Settings saved.');
          renderSidebar();
          renderCurrentPage();
        });

        document.getElementById('add-emp-form').addEventListener('submit', e => {
          e.preventDefault();
          const inp = document.getElementById('new-emp-input');
          const name = inp.value.trim();
          if (!name) return;
          if (!state.settings.employees.includes(name)) {
            state.settings.employees.push(name);
            saveState();
            showToast(`Added ${name}.`);
            renderCurrentPage();
          }
        });

        container.querySelectorAll('[data-rm-emp]').forEach(b => b.addEventListener('click', () => {
          const name = b.getAttribute('data-rm-emp');
          state.settings.employees = state.settings.employees.filter(x => x !== name);
          saveState();
          showToast(`Removed ${name}.`);
          renderCurrentPage();
        }));

        document.getElementById('reset-all-btn').addEventListener('click', () => {
          openConfirm('Reset All Data', 'This will erase all saved customers, leads, sales, and tasks. Continue?', 'Reset Everything', () => {
            state = getDefaultState();
            saveState();
            showToast('All CRM data has been reset.');
            renderSidebar();
            renderCurrentPage();
          });
        });
      }

      // Main Render Router
      function renderCurrentPage() {
        destroyCharts();
        const container = document.getElementById('main-content');
        container.innerHTML = '';
        if (currentPage === 'dashboard') renderDashboard(container);
        else if (currentPage === 'customers') renderCustomers(container);
        else if (currentPage === 'leads') renderLeads(container);
        else if (currentPage === 'products') renderProducts(container);
        else if (currentPage === 'tasks') renderTasks(container);
        else if (currentPage === 'calendar') renderCalendar(container);
        else if (currentPage === 'sales') renderSales(container);
        else if (currentPage === 'engagement') renderEngagement(container);
        else if (currentPage === 'reports') renderReports(container);
        else if (currentPage === 'settings') renderSettings(container);
        if (window.lucide) lucide.createIcons({ nodes: [container] });
      }

      // Global Wireup
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('open-sidebar-btn').addEventListener('click', openMobileSidebar);
        document.getElementById('close-sidebar-btn').addEventListener('click', closeMobileSidebar);
        document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileSidebar);
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
        document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirm);
        document.getElementById('confirm-ok-btn').addEventListener('click', () => {
          const cb = confirmCallback;
          closeConfirm();
          if (typeof cb === 'function') cb();
        });
        document.getElementById('quick-add-lead-btn').addEventListener('click', () => openLeadModal());
        document.getElementById('quick-add-sale-btn').addEventListener('click', () => openSaleModal());

        renderSidebar();
        renderCurrentPage();
        if (window.lucide) lucide.createIcons();
      });
    })();
  </script>
</body>
</html>
